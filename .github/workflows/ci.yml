name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # The suite must run offline against recorded fixtures (E2.S7).
      # No real keys are ever needed in CI; these prove the code fails loudly
      # rather than silently reaching for a live provider.
      FINDER_OFFLINE: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests scripts

      - name: Format check
        run: ruff format --check src tests scripts

      - name: Test with branch coverage
        run: pytest -q --cov=finder --cov-branch --cov-report=term-missing --cov-fail-under=88

      - name: Mutation audit
        # Passing tests prove nothing on their own. This breaks the code on
        # purpose and fails the build if the suite does not notice.
        run: python scripts/audit_tests.py

      - name: Backlog is loadable and internally consistent
        run: python scripts/load_backlog.py --dry-run
