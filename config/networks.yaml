# Network seed registry — the highest-yield asset in the system.
#
# Each network is a template that replicates across N nodes. Solve the
# programming or provider pattern once at one node, apply the identical
# extraction to every peer.
#
# node_count_est is an ORDER-OF-MAGNITUDE PLANNING FIGURE ONLY, used to size a
# harvest. W1 NetworkRegistrar establishes the real list from each network's own
# directory, and THAT list is what the system uses. Never treat these numbers as
# verified facts.
version: 1

networks:
  - id: nist_mep
    name: NIST Manufacturing Extension Partnership centers
    directory_url: https://www.nist.gov/mep/centers
    sectors: [manufacturing]
    node_count_est: 51
    tier: A
    notes: >
      Highest priority. Centers are contracted to work inside manufacturers, which
      makes them relationship_depth 5 CHANNEL targets. Most publish a third-party
      or approved-provider route. Validated example - GaMEP runs a statewide
      lunch-and-learn circuit delivered by staff and partners.

  - id: state_mfg_assns
    name: State manufacturers associations (NAM affiliates)
    directory_url: https://www.nam.org/state-associations/
    sectors: [manufacturing]
    node_count_est: 50
    tier: A

  - id: state_hospital_assns
    name: State hospital associations (AHA affiliates)
    directory_url: https://www.aha.org/about/state-hospital-associations
    sectors: [health]
    node_count_est: 46
    tier: A

  - id: himss_chapters
