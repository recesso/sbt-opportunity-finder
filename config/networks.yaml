  - id: tpm_collaboratives
    name: US Chamber Foundation Talent Pipeline Management collaboratives
    directory_url: https://www.uschamberfoundation.org/workforce/talent-pipeline-management
    sectors: [cross]
    node_count_est: null
    tier: A

  - id: eda_tech_hubs
    name: EDA Tech Hubs
    directory_url: https://www.eda.gov/funding/programs/regional-technology-and-innovation-hubs
    sectors: [cross]
    node_count_est: 31
    tier: A

  - id: state_training_systems
    name: State customized-training systems
    directory_url: null
    sectors: [cross]
    node_count_est: 30
    tier: A
    seed_members:
      - {name: AIDT, state: AL, domain: aidt.edu}
      - {name: LED FastStart, state: LA, domain: fastart.org}
      - {name: Georgia Quick Start, state: GA, domain: georgiaquickstart.org}
      - {name: NCEdge, state: NC, domain: null}
    notes: >
      No single national directory. Seeded from known members, then expanded via
      graph traversal of partner pages and peer references.

  - id: employer_intermediaries
    name: Employer intermediaries and field builders
    directory_url: null
    sectors: [cross]
    node_count_est: null
    tier: A
    seed_members:
      - {name: GPS Education Partners, domain: gpsed.org}
      - {name: Align Wisconsin, domain: null}
      - {name: America Achieves, domain: americaachieves.org}
      - {name: Jobs for the Future, domain: jff.org}
      - {name: Enterprise Technology Association, domain: joineta.org}
    notes: >
      The CHANNEL family in its purest form. Named by the founder himself as the
      one-to-many leverage he prioritises. Expand via each one's partner and
      funder lists.

  - id: ga_adjacent_chambers
    name: Chambers with named industry councils, GA and adjacent states
    directory_url: null
    discovery_method: ams_host_patterns
    sectors: [cross]
    node_count_est: 200
    tier: B
    notes: >
      No national directory worth using. Enumerated by the AMS host patterns in
      hosts.yaml - GrowthZone/ChamberMaster and MemberClicks expose predictable
      hosts and paths, which is what makes chambers enumerable rather than
      guessable. W1 walks those patterns per state instead of searching.
