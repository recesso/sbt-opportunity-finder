[project]
name = "sbt-opportunity-finder"
version = "0.1.0"
description = "Finds, ranks and surfaces the rooms, channels, employers and people where Skill Bridge Talent can engage employers consultatively."
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "tenacity>=8.3",
  "rapidfuzz>=3.9",
  "python-dateutil>=2.9",
  "structlog>=24.1",
  "scipy>=1.13",
  "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5", "hypothesis>=6.100", "respx>=0.21"]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finder"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["network: hits a live provider; excluded from CI"]

[tool.coverage.run]
branch = true
source = ["src/finder"]

[tool.coverage.report]
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  # Protocol method bodies. There is nothing there to execute.
  '^\s*\.\.\.$',
]
show_missing = true
